name: MoCKA Global Rule Guard

on:
  push:
  pull_request:

jobs:
  rule-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate MoCKA Structure
        run: |
          echo "Checking MoCKA structural integrity..."

          # RULE 2 (NO TEMP STRUCTURES): check real folder/file names, not document text.
          if find . -path ./.git -prune -o -name "*mocka_v0.1*" -print | grep -q .; then
            echo "RULE VIOLATION: temp structure named mocka_v0.1 detected"
            find . -path ./.git -prune -o -name "*mocka_v0.1*" -print
            exit 1
          fi

          if find . -type d -path "*/mcp/mcp" | grep -q .; then
            echo "RULE VIOLATION: double nesting detected (mcp/mcp)"
            exit 1
          fi

          if find . -type d -path "*/relay/relay" | grep -q .; then
            echo "RULE VIOLATION: double nesting detected (relay/relay)"
            exit 1
          fi

          if find . -type d -path "*/event/event" | grep -q .; then
            echo "RULE VIOLATION: double nesting detected (event/event)"
            exit 1
          fi

          echo "STRUCTURE OK"
