  #header { position: absolute; top: 10px; left: 10px; z-index: 10; pointer-events: none; max-width: calc(100% - 20px); }
  h1 { font-size: 16px; margin: 0 0 4px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
  .meta { font-size: 12px; color: #9a9a9a; }
  #banner { display: none; margin-top: 4px; font-size: 12px; color: #fff; background: #8e44ad; padding: 3px 8px; border-radius: 4px; width: fit-content; }
  #error { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); z-index: 20; background: #3a1010; border: 1px solid #e74c3c; padding: 16px; border-radius: 8px; font-size: 13px; max-width: 80%; }
  #ui { position: absolute; bottom: 16px; left: 16px; z-index: 10; background: rgba(20,20,25,0.9); padding: 12px; border-radius: 8px; border: 1px solid #333; width: min(340px, calc(100% - 32px)); box-sizing: border-box; backdrop-filter: blur(4px); }
  select, input { width: 100%; box-sizing: border-box; margin: 4px 0 8px; padding: 6px; font-size: 12px; background: #1c1c22; color: #fff; border: 1px solid #444; border-radius: 4px; }
  .legend span { display: inline-block; margin-right: 6px; font-size: 11px; }
  #detail { font-size: 11px; color: #ccc; max-height: 160px; overflow-y: auto; margin-top: 8px; border-top: 1px solid #333; padding-top: 6px; }
  #warnings { font-size: 11px; color: #f5b041; margin-top: 6px; white-space: pre-wrap; }
  #view-ctrl { position: absolute; top: 12px; right: 12px; z-index: 10; background: rgba(20,20,25,0.85); padding: 6px; border-radius: 8px; border: 1px solid #333; user-select: none; }
  #view-ctrl .row { display: flex; gap: 4px; justify-content: center; margin-bottom: 4px; }
  #view-ctrl .row span { width: 34px; }
  #view-ctrl button { width: 34px; height: 30px; background: #1c1c22; color: #eaeaea; border: 1px solid #444; border-radius: 6px; font-size: 14px; cursor: pointer; padding: 0; }
  #view-ctrl button:hover { background: #2a2a33; }
  #view-ctrl .hint { font-size: 10px; color: #9a9a9a; width: 170px; line-height: 1.4; margin-top: 4px; }
  #labels { position: absolute; inset: 0; z-index: 5; pointer-events: none; overflow: hidden; }
  .lbl { position: absolute; left: 0; top: 0; transform: translate(-50%, -170%); white-space: nowrap; font-size: 11px; color: #d9d9d9; background: rgba(11,11,15,0.78); border: 1px solid #3a3a44; border-radius: 4px; padding: 1px 5px; }
  .lbl.focus { color: #fff; border-color: #f1c40f; font-weight: 600; }
  #view-ctrl .sect { margin-top: 6px; font-size: 11px; color: #ddd; }
  #view-ctrl .sect label { display: block; margin-bottom: 4px; }
  #view-ctrl input[type=range] { width: 160px; vertical-align: middle; }
  #view-ctrl input[type=color] { width: 44px; height: 24px; padding: 0; border: 1px solid #444; background: none; vertical-align: middle; }
  #view-ctrl .sect button { font-size: 11px; height: 24px; width: auto; padding: 0 8px; margin-left: 6px; }
  body.light #header h1 { color: #111; text-shadow: none; }
  body.light #header .meta { color: #333; }
</style>

<div id="header">
  <h1>MoCKA 3D Orbit Map</h1>
  <div class="meta" id="meta-info">Initializing...</div>
  <div id="banner"></div>
</div>
<div id="error"></div>
<div id="labels"></div>

<div id="view-ctrl">
  <div class="row"><span></span><button data-act="up" title="上へ (↑)">▲</button><span></span></div>
  <div class="row"><button data-act="left" title="左へ (←)">◀</button><button data-act="reset" title="全体表示 (0)">⟳</button><button data-act="right" title="右へ (→)">▶</button></div>
  <div class="row"><span></span><button data-act="down" title="下へ (↓)">▼</button><span></span></div>
  <div class="row"><button data-act="zoomin" title="拡大 (+ / ホイール上)">＋</button><button data-act="zoomout" title="縮小 (- / ホイール下)">－</button></div>
  <div class="sect">
    <label>背景色 <input type="color" id="bg-color" value="#0b0b0f"><button id="bg-reset" title="既定の背景に戻す">既定</button></label>
    <label>接続線の太さ <span id="edge-w-val">2</span>px<br><input type="range" id="edge-width" min="1" max="12" step="1" value="2"></label>
  </div>
  <div class="hint">Shift+ドラッグ・矢印キーで移動<br>ホイール・＋－で拡大縮小<br>⟳ または 0 で全体表示</div>
</div>

<div id="ui">
  <label for="search-q">Search (id / name / path / note)</label>
  <input id="search-q" placeholder="e.g. N054, authorization, app.py">
  <label for="filter-status">Filter status</label>
  <select id="filter-status">
    <option value="">all status</option>
    <option value="CODE_CONFIRMED">CODE_CONFIRMED</option>
    <option value="RUNTIME_VERIFIED">RUNTIME_VERIFIED</option>
    <option value="PENDING">PENDING</option>
    <option value="PARTIAL">PARTIAL</option>
    <option value="CONFIRMED_ABSENT">CONFIRMED_ABSENT</option>
    <option value="UNKNOWN">UNKNOWN</option>
    <option value="STATE_OBSERVED">STATE_OBSERVED</option>
    <option value="DOCUMENTED">DOCUMENTED</option>
  </select>
  <div class="legend">
    <span style="color:#2ecc71">■ 完了・検証済み</span>
    <span style="color:#f1c40f">■ 制作中・保留</span>
    <span style="color:#e74c3c">■ 断線・未接続</span>
    <span style="color:#3498db">■ 観測</span>
    <span style="color:#7f8c8d">■ 文書のみ</span>
  </div>
  <div id="detail">Select a node in 3D space to inspect. Click empty space to clear focus.</div>
  <div id="warnings"></div>
</div>

<script>
(function () {
  'use strict';

  // ステータス → 色（仕様：緑=完了・検証済み / 黄=制作中・保留 / 赤=断線・未接続）
  const GREEN = 0x2ecc71, YELLOW = 0xf1c40f, RED = 0xe74c3c, BLUE = 0x3498db, GREY = 0x7f8c8d;
  const STATUS_STYLE = {
    CODE_CONFIRMED:      { color: GREEN,  kind: 'ok' },
    RUNTIME_VERIFIED:    { color: GREEN,  kind: 'ok' },
    DATA_FLOW_CONFIRMED: { color: GREEN,  kind: 'ok' },
    FS_CONFIRMED:        { color: GREEN,  kind: 'ok' },
    PENDING:             { color: YELLOW, kind: 'wip' },
    PARTIAL:             { color: YELLOW, kind: 'wip' },
    PLANNED:             { color: YELLOW, kind: 'wip' },
    CONFIRMED_ABSENT:    { color: RED,    kind: 'alert' },
    UNKNOWN:             { color: RED,    kind: 'alert' },
    STATE_OBSERVED:      { color: BLUE,   kind: 'observed' },
    DOCUMENTED:          { color: GREY,   kind: 'doc' }
  };
  const VOCAB = Object.keys(STATUS_STYLE);
  const styleOf = (s) => STATUS_STYLE[s] || STATUS_STYLE.UNKNOWN;

  // 集約の優先順位（深刻度順）。ノード色の決定に使う
  const SEVERITY = ['alert', 'wip', 'observed', 'doc', 'ok'];
  const ROLL_COLOR = { alert: RED, wip: YELLOW, observed: BLUE, doc: GREY, ok: GREEN, none: 0x3a3a3a };
  function rollupOf(list) {
    if (!list.length) return 'none';
    let best = SEVERITY.length;
    list.forEach((e) => { const i = SEVERITY.indexOf(styleOf(e.status).kind); if (i >= 0 && i < best) best = i; });
    return SEVERITY[best] || 'none';
  }

  const $ = (id) => document.getElementById(id);

  // ---------- 1. データ読み込み・検証（失敗時は理由を画面に出す） ----------
  function loadData() {
    const el = $('mocka-data');
    let raw;
    try { raw = JSON.parse(el.textContent); }
    catch (err) { throw new Error('埋め込みデータのJSONが不正です: ' + err.message); }
    if (!Array.isArray(raw.nodes) || !Array.isArray(raw.edges)) {
      throw new Error('nodes / edges の配列がありません');
    }
    const warnings = [];
    const ids = new Set();
    const nodes = [];
    for (const n of raw.nodes) {
      if (!n || typeof n.id !== 'string' || !n.id) { warnings.push('ID無しのノードを除外'); continue; }
      if (ids.has(n.id)) { warnings.push('ID重複を除外: ' + n.id); continue; }
      ids.add(n.id);
      // 注意: 実データではステータスはエッジに付く。ノード自身の status は使わない（架空の状態を作らない）
      nodes.push(Object.assign({}, n, { name: n.name || n.id }));
    }
    const edges = [];
    let skipped = 0;
    for (const e of raw.edges) {
      if (!e || !ids.has(e.from) || !ids.has(e.to)) { skipped++; warnings.push('存在しないノードを指すエッジを除外: ' + (e && e.id)); continue; }
      edges.push(Object.assign({}, e, { status: VOCAB.includes(e.status) ? e.status : 'UNKNOWN' }));
    }
    // ノードの色 = 接続エッジ状態の集約（最も深刻なもの）。接続なしは 'none'
    const incident = new Map(nodes.map((n) => [n.id, []]));
    edges.forEach((e) => { incident.get(e.from).push(e); incident.get(e.to).push(e); });
    nodes.forEach((n) => { n.incident = incident.get(n.id); n.rollup = rollupOf(n.incident); });
    return { raw, nodes, edges, skipped, warnings, layers: raw.layers || [] };
  }

  // ---------- 2. 3D 構築 ----------
  let data;
  try { data = loadData(); }
  catch (err) {
    $('error').style.display = 'block';
    $('error').textContent = 'データを読み込めませんでした: ' + err.message;
    $('meta-info').textContent = 'データ読み込み失敗';
    return;
  }
  if (typeof THREE === 'undefined') {
    $('error').style.display = 'block';
    $('error').textContent = '3Dライブラリ(Three.js)を読み込めませんでした。ネットワークまたはCDNを確認してください。';
    $('meta-info').textContent = '3Dエンジン未読込';
    return;
  }

  if (data.raw.source === 'fixture') {
    $('banner').style.display = 'block';
    $('banner').textContent = 'FIXTURE DATA（テスト用の合成データ・実データではありません）';
  }
  $('meta-info').textContent =
    'observed ' + (data.raw.observed_at || '-') +
    ' | nodes ' + data.nodes.length + ' | edges ' + data.edges.length +
    ' | skipped ' + data.skipped;
  $('warnings').textContent = data.warnings.length ? '注意 ' + data.warnings.length + ' 件\n' + data.warnings.join('\n') : '';

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0b0b0f, 0.008);
  const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);
  camera.position.set(0, 30, 95);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);
  renderer.setClearColor(0x0b0b0f, 1);

  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  const light = new THREE.PointLight(0xffffff, 1.2);
  light.position.set(60, 60, 60);
  scene.add(light);

  // 全体を回すグループ（ドラッグ・自転はこれに適用）
  const orbit = new THREE.Group();
  scene.add(orbit);

  // レイヤーごとに傾いた軌道（同心の輪）上へ決定的に配置する
  const groups = new Map();
  data.nodes.forEach((n) => {
    const li = data.layers.indexOf(n.layer);
    const key = li < 0 ? data.layers.length : li;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(n);
  });
  const meshes = new Map();   // id -> mesh
  const nodeList = [];
  [...groups.keys()].sort((a, b) => a - b).forEach((key, gi) => {
    const members = groups.get(key);
    const R = 16 + gi * 4;
    const tilt = gi * 0.35;
    members.forEach((n, k) => {
      const a = (2 * Math.PI * k) / members.length + gi * 0.4;
      const p = new THREE.Vector3(R * Math.cos(a), 0, R * Math.sin(a)).applyAxisAngle(new THREE.Vector3(1, 0, 0), tilt);
      const roll = n.rollup;
      const color = ROLL_COLOR[roll];
      const alert = roll === 'alert';
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(alert ? 1.5 : 1.2, 16, 16),
        new THREE.MeshStandardMaterial({
          color: color, emissive: color,
          emissiveIntensity: alert ? 0.9 : (roll === 'wip' ? 0.6 : 0.35),
          roughness: 0.25, transparent: true, opacity: 1
        })
      );
      mesh.position.copy(p);
      mesh.userData = { node: n, kind: roll, base: 1 };
      orbit.add(mesh);
      meshes.set(n.id, mesh);
      nodeList.push(mesh);
    });
  });

  // エッジ（存在するノード同士のみ）
  const edgeObjs = [];
  // 接続線：WebGL の線は太さを変えられないため、細い円柱で描く（太さは画面上のピクセル数で指定）
  const UNIT_CYL = new THREE.CylinderGeometry(1, 1, 1, 6, 1, true);
  const UP_AXIS = new THREE.Vector3(0, 1, 0);
  const _pa = new THREE.Vector3(), _pb = new THREE.Vector3(), _dir = new THREE.Vector3();
  data.edges.forEach((e) => {
    const a = meshes.get(e.from), b = meshes.get(e.to);
    const st = styleOf(e.status);
    const mat = new THREE.MeshBasicMaterial({ color: st.color, transparent: true, opacity: 0.45 });
    const line = new THREE.Mesh(UNIT_CYL, mat);
    _pa.copy(a.position); _pb.copy(b.position);
    _dir.subVectors(_pb, _pa);
    line.position.addVectors(_pa, _pb).multiplyScalar(0.5);
    line.quaternion.setFromUnitVectors(UP_AXIS, _dir.clone().normalize());
    line.userData = { edge: e, len: _dir.length() };
    orbit.add(line);
    edgeObjs.push({ line, e });
  });
  // 太さ（px）→ ワールド半径。毎フレーム計算し、ズームしても画面上の太さを保つ
  const edgeStyle = { widthPx: 2 };
  function updateEdgeWidths() {
    const worldPerPx = (view.dist * 2 * TAN_HALF_V) / innerHeight;
    const r = Math.max(0.001, (edgeStyle.widthPx / 2) * worldPerPx);
    edgeObjs.forEach(({ line }) => { line.scale.set(r, line.userData.len, r); });
  }

  // ---------- 2b. 表示範囲（パン・ズーム・全体表示） ----------
  // 注視点 target を中心に、距離 dist から正面を見る。
  const TAN_HALF_V = Math.tan(THREE.MathUtils.degToRad(30)); // 縦視野60度の半分
  const view = {
    target: new THREE.Vector3(0, 0, 0),
    dist: 100,
    fitDist: 100,
    // 全点が回転しても必ず画面に入る距離を求める（点が手前に来る場合も考慮）
    fit() {
      let maxR = 0;
      meshes.forEach((m) => { maxR = Math.max(maxR, m.position.length()); });
      const aspect = innerWidth / innerHeight;
      const tanH = TAN_HALF_V * Math.min(1, aspect); // 横が狭い画面では横方向が制限
      this.fitDist = maxR * (1 + 1 / tanH) + 4;
      this.dist = this.fitDist;
    },
    // dx, dy は ±1 の方向指定（ボタン・矢印キー）
    pan(dx, dy) {
      const k = this.dist * 0.08;
      this.target.x += dx * k;
      this.target.y += dy * k;
    },
    // Shift+ドラッグ：画面のピクセル移動量ぶん動かす
    panPixels(px, py) {
      const k = (this.dist * 2 * TAN_HALF_V) / innerHeight;
      this.target.x -= px * k;
      this.target.y += py * k;
    },
    zoom(f) {
      this.dist = Math.min(this.fitDist * 4, Math.max(8, this.dist * f));
    },
    reset() {
      this.target.set(0, 0, 0);
      this.fit();
    },
    apply() {
      camera.position.set(this.target.x, this.target.y + this.dist * 0.25, this.target.z + this.dist);
      camera.lookAt(this.target);
    },
  };
  view.fit();
  view.apply();

  // 操作パネル・キーボード・ホイール
  const actions = {
    up: () => view.pan(0, 1), down: () => view.pan(0, -1),
    left: () => view.pan(-1, 0), right: () => view.pan(1, 0),
    zoomin: () => view.zoom(0.8), zoomout: () => view.zoom(1.25),
    reset: () => view.reset(),
  };
  document.querySelectorAll('#view-ctrl button[data-act]').forEach((b) => {
    b.addEventListener('click', () => actions[b.dataset.act]());
  });
  const KEYS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', '+': 'zoomin', '=': 'zoomin', '-': 'zoomout', '0': 'reset' };
  addEventListener('keydown', (e) => {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
    const a = KEYS[e.key];
    if (a) { e.preventDefault(); actions[a](); }
  });
  renderer.domElement.addEventListener('wheel', (e) => {
    e.preventDefault();
    view.zoom(e.deltaY > 0 ? 1.1 : 0.9);
  }, { passive: false });

  // ---------- 2d. Synapse オーバーレイ（シミュレーターの経路を重ね描き） ----------
  // 経路の両端は実データのノード。経路線は実データの線とは別物で、データには含めない。
  const SYNAPSE_PATH = [
    { key: 'edge_hg_to_auth',  from: 'N050', to: 'N060' }, // Human Gate -> Authorization
    { key: 'edge_auth_to_rt',  from: 'N060', to: 'N064' }, // Authorization -> RuntimeGate
    { key: 'edge_rt_to_cons',  from: 'N064', to: 'N070' }, // RuntimeGate -> Consequence
    { key: 'edge_cons_to_mem', from: 'N070', to: 'N074' }, // Consequence -> Memory
  ];
  // 色は 3D 側が状態から決める（受信側で色を信じない）
  const SYN_COLOR = { VERIFIED: 0x2ecc71, BROKEN: 0xe74c3c, NOT_REACHED: 0x9a9a9a };
  const SYN_STATUS = Object.keys(SYN_COLOR);
  const synapseEdges = new Map(); // key -> 線（userData に状態を持つ）
  SYNAPSE_PATH.forEach((p) => {
    const a = meshes.get(p.from), b = meshes.get(p.to);
    if (!a || !b) return; // 端点が無ければ描かない
    _pa.copy(a.position); _pb.copy(b.position);
    _dir.subVectors(_pb, _pa);
    const mat = new THREE.MeshBasicMaterial({ color: SYN_COLOR.NOT_REACHED, transparent: true, opacity: 0.9 });
    const line = new THREE.Mesh(UNIT_CYL, mat);
    line.position.addVectors(_pa, _pb).multiplyScalar(0.5);
    line.quaternion.setFromUnitVectors(UP_AXIS, _dir.clone().normalize());
    line.userData = { synapseKey: p.key, len: _dir.length(), status: 'NOT_REACHED', widthPx: 1, highlight: false };
    line.scale.set(0.01, line.userData.len, 0.01);
    orbit.add(line);
    synapseEdges.set(p.key, line);
  });
  // 状態を検証して反映する（不正な値・未知のキーは無視する）
  function applySynapseStyles(payload) {
    if (!payload || typeof payload !== 'object') return;
    SYNAPSE_PATH.forEach((p) => {
      const line = synapseEdges.get(p.key);
      const s = payload[p.key];
      if (!line || !s || SYN_STATUS.indexOf(s.status) === -1) return;
      line.userData.status = s.status;
      line.material.color.setHex(SYN_COLOR[s.status]);
      line.userData.widthPx = Math.min(8, Math.max(1, Number(s.width) || 1));
      line.userData.highlight = s.highlight === true;
      if (!line.userData.highlight) line.material.opacity = 0.9;
    });
  }
  // 太さ（px）と点滅（遮断箇所）を毎フレーム反映する
  function updateSynapseOverlay(t) {
    const worldPerPx = (view.dist * 2 * TAN_HALF_V) / innerHeight;
    synapseEdges.forEach((line) => {
      const ud = line.userData;
      const r = Math.max(0.001, (ud.widthPx / 2) * worldPerPx);
      line.scale.set(r, ud.len, r);
      if (ud.highlight) line.material.opacity = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(t * 6));
    });
  }
  // 親ページ（シミュレーター画面）からの指示だけを受け付ける
  addEventListener('message', (e) => {
    if (!window.parent || e.source !== window.parent) return;
    const d = e.data;
    if (!d || d.type !== 'synapse3d.styles') return;
    applySynapseStyles(d.payload);
  });
  // 準備完了を親に知らせる（親は直後に現在の状態を送り直す）
  if (window.parent && window.parent !== window) window.parent.postMessage({ type: 'synapse3d.ready' }, '*');

  // ---------- 2e. 創造演算の横のつながり（紫の閃光・仮説） ----------
  // 演算はこのページ内の実データに対して行う（データを外へ出さない）。結果の要約だけを親へ返す。
  const LAT_COLOR = 0xd08cff; // 明るい紫（発光が目立つように）
  let lateralMeshes = [];
  function clearLaterals() {
    lateralMeshes.forEach((m) => { orbit.remove(m); m.material.dispose(); });
    lateralMeshes = [];
  }
  function setLaterals(list) {
    clearLaterals();
    list.forEach((l) => {
      const a = meshes.get(l.from), b = meshes.get(l.to);
      if (!a || !b) return; // 端点が無ければ描かない
      _pa.copy(a.position); _pb.copy(b.position);
      _dir.subVectors(_pb, _pa);
      const mat = new THREE.MeshBasicMaterial({ color: LAT_COLOR, transparent: true, opacity: 0.9 });
      const m = new THREE.Mesh(UNIT_CYL, mat);
      m.position.addVectors(_pa, _pb).multiplyScalar(0.5);
      m.quaternion.setFromUnitVectors(UP_AXIS, _dir.clone().normalize());
      m.userData = { lateralId: l.id, len: _dir.length(), widthPx: 5 };
      m.scale.set(0.01, m.userData.len, 0.01);
      orbit.add(m);
      lateralMeshes.push(m);
    });
  }
  // 紫の閃光：不透明度を時間で揺らし、太さは画面上の px で保つ
  function updateLaterals(t) {
    if (!lateralMeshes.length) return;
    const worldPerPx = (view.dist * 2 * TAN_HALF_V) / innerHeight;
    lateralMeshes.forEach((m) => {
      const r = Math.max(0.001, (m.userData.widthPx / 2) * worldPerPx);
      m.scale.set(r, m.userData.len, r);
      m.material.opacity = 0.75 + 0.25 * Math.sin(t * 4);
    });
  }
  // 創造演算を実行し、結果の要約を返す（ログ・未知数・横のつながり・刈り込みの内訳）
  function runAwakening() {
    if (typeof LogicEngine === 'undefined') return { error: 'ENGINE_NOT_LOADED' };
    const res = LogicEngine.awaken({ nodes: data.nodes, edges: data.edges }, {});
    const list = Synapse3DBridge.translateLateralTo3D(res);
    setLaterals(list);
    return {
      status: res.status,
      rounds: res.rounds,
      unknown: res.unknown,
      laterals: list,
      constraints: res.constraints.length,
      pruned: res.pruned.reduce((m, p) => { m[p.reason] = (m[p.reason] || 0) + 1; return m; }, {}),
      log: res.log.map((l) => ({ step: l.step, msg: l.msg })),
    };
  }
  // 親ページ（シミュレーター）からの「演算開始」だけを受け付ける
  addEventListener('message', (e) => {
    if (!window.parent || e.source !== window.parent) return;
    if (!e.data || e.data.type !== 'synapse3d.awaken') return;
    window.parent.postMessage({ type: 'synapse3d.awakened', result: runAwakening() }, '*');
  });

  // ---------- 2c. 表示設定（背景色・接続線の太さ） ----------
  const DEFAULT_BG = '#0b0b0f';
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (_) { /* 保存できない環境では無視 */ } },
  };
  function setBackground(hex) {
    const c = new THREE.Color(hex);
    renderer.setClearColor(c, 1);
    scene.fog.color.copy(c);
    document.body.style.background = hex;
    const lum = 0.299 * c.r + 0.587 * c.g + 0.114 * c.b; // 0〜1
    document.body.classList.toggle('light', lum > 0.6);
    $('bg-color').value = hex;
    store.set('mocka.bg', hex);
  }
  function setEdgeWidth(px) {
    edgeStyle.widthPx = px;
    $('edge-width').value = px;
    $('edge-w-val').textContent = px;
    store.set('mocka.edgeWidth', String(px));
  }
  $('bg-color').addEventListener('input', (e) => setBackground(e.target.value));
  $('bg-reset').addEventListener('click', () => setBackground(DEFAULT_BG));
  $('edge-width').addEventListener('input', (e) => setEdgeWidth(Number(e.target.value)));
  const savedBg = store.get('mocka.bg');
  setBackground(/^#[0-9a-fA-F]{6}$/.test(savedBg || '') ? savedBg : DEFAULT_BG);
  const savedW = Number(store.get('mocka.edgeWidth'));
  setEdgeWidth(savedW >= 1 && savedW <= 12 ? savedW : 2);

  // ---------- 3. 検索・フィルタ（ノードとその接続線に反映） ----------
  function applyFilter() {
    const q = $('search-q').value.trim().toLowerCase();
    const st = $('filter-status').value;
    const visibleIds = new Set();
    data.nodes.forEach((n) => {
      const hay = [n.id, n.name, n.path, n.note, n.type].filter(Boolean).join(' ').toLowerCase();
      const ok = (!q || hay.includes(q)) && (!st || n.incident.some((e) => e.status === st));
      if (ok) visibleIds.add(n.id);
      meshes.get(n.id).visible = ok;
    });
    edgeObjs.forEach(({ line, e }) => { line.visible = visibleIds.has(e.from) && visibleIds.has(e.to) && (!st || e.status === st); });
    updateStatusLine(visibleIds.size);
  }
  function updateStatusLine(shown) {
    $('meta-info').textContent =
      'observed ' + (data.raw.observed_at || '-') +
      ' | nodes ' + shown + '/' + data.nodes.length +
      ' | edges ' + data.edges.length + ' | skipped ' + data.skipped;
  }
  $('search-q').addEventListener('input', applyFilter);
  $('filter-status').addEventListener('change', applyFilter);
  // 選択肢はデータに実際に出現するエッジ状態だけにする
  $('filter-status').innerHTML = '<option value="">all status</option>';
  [...new Set(data.edges.map((e) => e.status))].sort().forEach((s) => {
    const o = document.createElement('option'); o.value = s; o.textContent = s; $('filter-status').appendChild(o);
  });

  // ---------- 4b. ラベル（選択ノードと接続先のファイル名を画面上に表示） ----------
  const labelLayer = $('labels');
  const labelOf = new Map(); // id -> 表示要素
  function labelText(n) {
    const p = n.path || '';
    const base = p && p !== '.' ? p.split(/[\\/]/).pop() : '';
    return n.id + ' · ' + (base || n.name || n.id);
  }
  function setLabels(ids) {
    const keep = new Set(ids);
    labelOf.forEach((el, id) => { if (!keep.has(id)) { el.remove(); labelOf.delete(id); } });
    ids.forEach((id) => {
      if (!labelOf.has(id)) {
        const el = document.createElement('div');
        el.className = 'lbl';
        el.textContent = labelText(meshes.get(id).userData.node);
        labelLayer.appendChild(el);
        labelOf.set(id, el);
      }
      labelOf.get(id).classList.toggle('focus', id === focusId);
    });
  }
  const _lblVec = new THREE.Vector3();
  function updateLabels() {
    labelOf.forEach((el, id) => {
      const mesh = meshes.get(id);
      if (!mesh.visible) { el.style.display = 'none'; return; }
      mesh.getWorldPosition(_lblVec).project(camera);
      if (_lblVec.z > 1 || Math.abs(_lblVec.x) > 1.1 || Math.abs(_lblVec.y) > 1.1) { el.style.display = 'none'; return; }
      el.style.display = 'block';
      el.style.left = ((_lblVec.x + 1) / 2 * innerWidth) + 'px';
      el.style.top = ((-_lblVec.y + 1) / 2 * innerHeight) + 'px';
    });
  }

  // ---------- 4. 操作（ドラッグ回転・クリックで詳細とフォーカス） ----------
  let dragging = false, moved = 0, last = null, downAt = null, focusId = null;
  renderer.domElement.addEventListener('pointerdown', (e) => {
    dragging = true; moved = 0; last = { x: e.clientX, y: e.clientY }; downAt = { x: e.clientX, y: e.clientY };
  });
  addEventListener('pointerup', (e) => {
    dragging = false;
    const d = downAt;
    downAt = null; // ボタン操作などで古い押下位置を使わないようにする
    if (d && Math.hypot(e.clientX - d.x, e.clientY - d.y) < 5) pick(e.clientX, e.clientY);
  });
  addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - last.x, dy = e.clientY - last.y;
    moved += Math.abs(dx) + Math.abs(dy);
    if (e.shiftKey) {
      view.panPixels(dx, dy);
    } else {
      orbit.rotation.y += dx * 0.005;
      orbit.rotation.x = Math.max(-1.2, Math.min(1.2, orbit.rotation.x + dy * 0.005));
    }
    last = { x: e.clientX, y: e.clientY };
  });

  const ray = new THREE.Raycaster();
  function pick(cx, cy) {
    const ndc = new THREE.Vector2((cx / innerWidth) * 2 - 1, -(cy / innerHeight) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObjects(nodeList.filter((m) => m.visible), false)[0];
    focusId = hit ? hit.object.userData.node.id : null;
    applyFocus();
  }

  function applyFocus() {
    if (!focusId) {
      edgeObjs.forEach(({ line }) => { line.material.opacity = 0.45; });
      $('detail').textContent = 'Select a node in 3D space to inspect. Click empty space to clear focus.';
      setLabels([]);
      return;
    }
    const n = meshes.get(focusId).userData.node;
    const out = data.edges.filter((e) => e.from === focusId);
    const inn = data.edges.filter((e) => e.to === focusId);
    edgeObjs.forEach(({ line, e }) => {
      line.material.opacity = (e.from === focusId || e.to === focusId) ? 1.0 : 0.08;
    });
    setLabels([...new Set([focusId, ...n.incident.map((e) => (e.from === focusId ? e.to : e.from))])]);
    const d = $('detail');
    d.innerHTML = '';
    const title = document.createElement('b');
    title.textContent = '[' + n.id + '] ' + n.name;
    const lines = [
      'Layer: ' + (n.layer || '-') + ' | Type: ' + (n.type || '-'),
      'Path: ' + (n.path || 'N/A'),
      'Rollup of edge statuses: ' + n.rollup + ' (ノード自身のステータスではない)',
      'Outgoing: ' + out.length + ' | Incoming: ' + inn.length
    ];
    d.appendChild(title);
    lines.forEach((t) => { d.appendChild(document.createElement('br')); d.appendChild(document.createTextNode(t)); });
    n.incident.forEach((e) => {
      const other = e.from === focusId ? e.to : e.from;
      const row = document.createElement('div');
      row.style.marginTop = '4px';
      row.textContent = e.id + ' [' + e.status + '] ' + (e.from === focusId ? '→ ' : '← ') + other +
        ' (' + e.relation + ')' + (e.note ? ' — ' + e.note : '');
      d.appendChild(row);
    });
  }

  // ---------- 5. 描画ループ（赤・黄ノードの警告脈動、自転） ----------
  const clock = new THREE.Clock();
  let rafId = 0;
  function frame() {
    rafId = requestAnimationFrame(frame);
    const t = clock.getElapsedTime();
    if (!dragging) orbit.rotation.y += 0.0008;
    meshes.forEach((m) => {
      const kind = m.userData.kind;
      if (kind === 'alert') {
        const s = 1 + Math.sin(t * 6) * 0.25;
        m.scale.setScalar(s);
        m.material.emissiveIntensity = 0.6 + 0.4 * (0.5 + 0.5 * Math.sin(t * 6));
      } else if (kind === 'wip') {
        m.scale.setScalar(1 + Math.sin(t * 3) * 0.12);
      }
    });
    view.apply();
    updateEdgeWidths();
    updateSynapseOverlay(clock.getElapsedTime());
    updateLaterals(clock.getElapsedTime());
    renderer.render(scene, camera);
    updateLabels();
  }
  frame();

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  addEventListener('pagehide', () => cancelAnimationFrame(rafId));

  // テスト用に最小限の参照だけ公開（画面の動作には影響しない）
  window.__mockaDebug = { meshes, edgeObjs, orbit, camera, view, synapseEdges, laterals: () => lateralMeshes.map((m) => ({ id: m.userData.lateralId, color: m.material.color.getHexString() })), get focusId() { return focusId; } };
  updateStatusLine(data.nodes.length);
})();
</script>
